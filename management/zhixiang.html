<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「智饷」高校智慧食堂 - 体验全新的校园就餐生活</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appleBlue: '#0071E3',
                        appleDark: '#1D1D1F',
                        appleGray: '#F5F5F7',
                        appleText: '#424245',
                        appleLightGray: '#86868B',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Helvetica Neue"', 'sans-serif'],
                    },
                    boxShadow: {
                        apple: '0 4px 20px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 基础苹果风重置与动画 */
        body { background-color: #F5F5F7; color: #1D1D1F; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 隐藏滚动条但允许滚动 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 呼吸动画（用于预警） */
        .pulse-red { animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); } }
    </style>
</head>
<body class="font-sans antialiased">

    <nav class="glass-nav fixed top-0 w-full z-50 transition-all duration-300">
        <div class="max-w-[1200px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="text-xl font-bold tracking-tight cursor-pointer" onclick="navigate('home')">
                <i class="fa-solid fa-leaf text-appleBlue mr-2"></i>智饷校园
            </div>
            <div class="hidden md:flex space-x-8 text-[15px] font-medium text-appleText">
                <a href="#" class="nav-link hover:text-appleBlue transition-colors" data-target="order">智能点餐</a>
                <a href="#" class="nav-link hover:text-appleBlue transition-colors" data-target="nutrition">AI营养师</a>
                <a href="#" class="nav-link hover:text-appleBlue transition-colors" data-target="social">食话广场</a>
                <a href="#" class="nav-link hover:text-appleBlue transition-colors" data-target="culture">文创活动</a>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative text-appleText hover:text-appleBlue transition">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
                <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden cursor-pointer border border-gray-300">
                    <img src="https://ui-avatars.com/api/?name=User&background=0066CC&color=fff" alt="User">
                </div>
            </div>
        </div>
    </nav>

    <main id="app-root" class="pt-24 pb-20 min-h-screen max-w-[1200px] mx-auto px-4 sm:px-6"></main>

    <div id="cart-drawer" class="fixed inset-y-0 right-0 w-96 glass-panel z-[60] transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center">
            <h2 class="text-2xl font-bold">我的餐盘</h2>
            <button onclick="toggleCart()" class="text-gray-400 hover:text-appleDark"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
            </div>
        <div class="p-6 border-t border-gray-200 bg-gray-50/50">
            <div class="flex justify-between mb-4 font-semibold text-lg">
                <span>总计</span>
                <span id="cart-total" class="text-appleBlue">¥0.00</span>
            </div>
            <button onclick="simulateCheckout()" class="w-full bg-appleBlue hover:bg-blue-600 text-white font-semibold py-3 rounded-2xl transition-colors shadow-md">
                一键下单 (Apple Pay模拟)
            </button>
        </div>
    </div>

    <div class="fixed bottom-8 right-8 z-[100] flex flex-col items-end">
        <div id="ai-panel" class="mb-4 w-80 sm:w-96 glass-panel rounded-[24px] overflow-hidden opacity-0 scale-95 pointer-events-none transition-all duration-300 origin-bottom-right shadow-2xl flex flex-col" style="height: 500px;">
            <div class="bg-appleBlue text-white p-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm"><i class="fa-solid fa-robot"></i></div>
                    <span class="font-semibold tracking-wide">小智 AI 助理</span>
                </div>
                <button onclick="toggleAI()" class="text-white/80 hover:text-white"><i class="fa-solid fa-chevron-down"></i></button>
            </div>
            
            <div id="ai-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50/50 text-sm">
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 rounded-full bg-appleBlue text-white flex shrink-0 items-center justify-center"><i class="fa-solid fa-robot text-xs"></i></div>
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 text-appleText">
                        同学你好！我是你的专属饮食管家小智。可以问我排队情况、帮你搭配减脂餐，或者直接让我帮你下单哦！
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 pl-10">
                    <button onclick="sendAiMessage('查看当前排队情况')" class="px-3 py-1 bg-blue-50 text-appleBlue rounded-full border border-blue-100 hover:bg-blue-100 transition-colors">🔥 看排队情况</button>
                    <button onclick="sendAiMessage('帮我推荐一份减脂午餐')" class="px-3 py-1 bg-green-50 text-green-600 rounded-full border border-green-100 hover:bg-green-100 transition-colors">🥗 减脂午餐</button>
                </div>
            </div>

            <div class="p-3 border-t border-gray-200 bg-white flex items-center space-x-2">
                <button class="w-10 h-10 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors"><i class="fa-solid fa-microphone"></i></button>
                <input type="text" id="ai-input" placeholder="输入指令，例如：去二食堂占座..." class="flex-1 bg-gray-100 rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-appleBlue/50 text-sm">
                <button onclick="handleAiInput()" class="w-10 h-10 rounded-full bg-appleBlue text-white hover:bg-blue-600 transition-colors shadow-sm"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <button onclick="toggleAI()" class="w-16 h-16 rounded-full bg-appleBlue text-white shadow-[0_10px_25px_rgba(0,113,227,0.4)] flex items-center justify-center text-2xl hover:scale-105 transition-transform duration-300 relative">
            <i class="fa-solid fa-robot"></i>
            <span class="absolute top-0 right-0 w-4 h-4 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>
        </button>
    </div>

    <footer class="border-t border-gray-200 mt-20 bg-white">
        <div class="max-w-[1200px] mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center text-sm text-appleLightGray">
            <p>© 2026 智饷校园团队 (中央财经大学). All rights reserved.</p>
            <div class="space-x-4 mt-4 md:mt-0">
                <a href="#" class="hover:text-appleText">隐私政策</a>
                <a href="#" class="hover:text-appleText">高校合作</a>
                <a href="#" class="hover:text-appleText">问题反馈</a>
            </div>
        </div>
    </footer>

    <script>
        // --- 模拟数据库 (Mock Data) ---
        const DB = {
            restaurants: [
                { id: 1, name: '中央财经大学·沙河校区第一食堂', queues: 120, waitTime: 26, seats: 45, totalSeats: 200, status: 'warning' },
                { id: 2, name: '沙河校区·风味餐厅 (清真)', queues: 15, waitTime: 5, seats: 120, totalSeats: 150, status: 'good' },
                { id: 3, name: '学院南路·学一食堂', queues: 85, waitTime: 18, seats: 12, totalSeats: 300, status: 'normal' }
            ],
            menu: [
                { id: 101, name: '西红柿炒鸡蛋', category: '热菜', price: 6.5, img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80', cal: 250, protein: 12, tag: '减脂推荐', sales: 450, rating: 4.8 },
                { id: 102, name: '红烧肉套餐', category: '套餐', price: 15.0, img: 'https://images.unsplash.com/photo-1617093727343-374698b1b08d?w=400&q=80', cal: 800, protein: 25, tag: '人气爆款', sales: 980, rating: 4.9 },
                { id: 103, name: '清炒西兰花', category: '凉菜', price: 4.0, img: 'https://images.unsplash.com/photo-1556801712-76c8eb07bbc9?w=400&q=80', cal: 80, protein: 3, tag: '低卡', sales: 300, rating: 4.6 },
                { id: 104, name: '鲜榨橙汁', category: '饮品', price: 8.0, img: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?w=400&q=80', cal: 110, protein: 1, tag: '新品', sales: 150, rating: 4.7 }
            ],
            social: [
                { id: 1, user: '种菜闪餐小队长', avatar: 'https://ui-avatars.com/api/?name=种', content: '今天风味餐厅上新的石锅拌饭绝了！🍚 排队只用了5分钟，小智推荐的时间点完美避开高峰！', time: '10分钟前', likes: 45 },
                { id: 2, user: '期末考神', avatar: 'https://ui-avatars.com/api/?name=考', content: '一食堂二楼的糖醋排骨今天有点咸，大家注意避雷或者多打点米饭 😭', time: '1小时前', likes: 12 }
            ],
            culture: [
                { id: 1, name: '「财大龙马」定制餐具套装', price: 39.9, img: 'https://images.unsplash.com/photo-1581622558667-3419a8dc5f83?w=400&q=80', desc: '融入中财校徽元素，环保麦秸秆材质，限量500套。' },
                { id: 2, name: '校庆限定：银杏流沙包', price: 12.0, img: 'https://images.unsplash.com/photo-1512152272829-459f0f971c26?w=400&q=80', desc: '以秋季校园满地银杏为灵感，南瓜外皮+咸蛋黄流沙。' }
            ]
        };

        // --- 全局状态管理 ---
        let state = {
            cart: [],
            currentView: 'order', // 默认进入智能点餐页
            aiOpen: false,
            userProfile: { goal: '减脂', avoid: '花生' }
        };

        // --- 核心路由与渲染引擎 ---
        const appRoot = document.getElementById('app-root');

        function navigate(view) {
            state.currentView = view;
            document.querySelectorAll('.nav-link').forEach(link => {
                link.style.color = link.dataset.target === view ? '#0071E3' : '#424245';
            });
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 监听导航点击
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navigate(e.target.dataset.target);
            });
        });

        function render() {
            appRoot.innerHTML = '';
            appRoot.className = 'pt-24 pb-20 min-h-screen max-w-[1200px] mx-auto px-4 sm:px-6 fade-in';
            
            if (state.currentView === 'order') renderOrderView();
            else if (state.currentView === 'nutrition') renderNutritionView();
            else if (state.currentView === 'social') renderSocialView();
            else if (state.currentView === 'culture') renderCultureView();
        }

        // ================= 模块1：智能点餐系统 =================
        function renderOrderView() {
            let html = `
                <div class="mb-12">
                    <h1 class="text-4xl font-bold mb-2 tracking-tight">智能点餐与占座</h1>
                    <p class="text-appleLightGray text-lg mb-8">实时避开高峰，锁定专属座位。</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${DB.restaurants.map(r => `
                            <div class="bg-white rounded-[20px] p-6 shadow-apple border border-gray-100 hover:-translate-y-1 transition-transform relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-2 h-full ${r.status === 'warning' ? 'bg-red-500' : (r.status === 'good' ? 'bg-green-500' : 'bg-yellow-500')}"></div>
                                <h3 class="text-xl font-semibold mb-4">${r.name}</h3>
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-gray-500"><i class="fa-solid fa-users mr-2"></i>排队人数</span>
                                    <span class="font-bold ${r.status === 'warning' ? 'text-red-500' : ''}">${r.queues} 人</span>
                                </div>
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-gray-500"><i class="fa-regular fa-clock mr-2"></i>预计时长</span>
                                    <span class="font-bold ${r.status === 'warning' ? 'text-red-500 pulse-red rounded-full px-2' : ''}">${r.waitTime} min</span>
                                </div>
                                <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-100">
                                    <span class="text-gray-500"><i class="fa-solid fa-chair mr-2"></i>空闲座位</span>
                                    <span class="text-appleBlue font-bold">${r.seats}/${r.totalSeats}</span>
                                </div>
                                <button class="w-full mt-4 bg-gray-100 hover:bg-gray-200 text-appleDark py-2 rounded-xl transition font-medium">查看菜单 & 选座</button>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div>
                    <h2 class="text-2xl font-bold mb-6">今日推荐菜品</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                        ${DB.menu.map(item => `
                            <div class="bg-white rounded-[20px] overflow-hidden shadow-apple border border-gray-100 group">
                                <div class="h-48 overflow-hidden relative">
                                    <img src="${item.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${item.name}">
                                    <div class="absolute top-3 left-3 bg-white/90 backdrop-blur text-xs px-2 py-1 rounded-md font-semibold text-appleDark">${item.tag}</div>
                                </div>
                                <div class="p-5">
                                    <div class="flex justify-between items-start mb-2">
                                        <h3 class="text-lg font-bold">${item.name}</h3>
                                        <span class="text-appleBlue font-bold">¥${item.price.toFixed(1)}</span>
                                    </div>
                                    <div class="text-xs text-gray-500 mb-4 flex space-x-3">
                                        <span>🔥 ${item.cal} 千卡</span>
                                        <span>🥩 蛋白 ${item.protein}g</span>
                                    </div>
                                    <div class="flex justify-between items-center mt-2">
                                        <span class="text-xs text-gray-400">月售 ${item.sales} | 评分 ${item.rating}</span>
                                        <button onclick="addToCart(${item.id})" class="bg-appleBlue text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-blue-600 transition shadow-md">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            appRoot.innerHTML = html;
        }

        // ================= 模块2：AI营养系统 =================
        function renderNutritionView() {
            let html = `
                <div class="max-w-4xl mx-auto slide-up">
                    <div class="text-center mb-12">
                        <h1 class="text-4xl font-bold mb-4">你的专属 AI 营养师</h1>
                        <p class="text-appleLightGray text-lg">结合《健康大模型训练报告》算法，为您动态规划每日饮食。</p>
                    </div>

                    <div class="bg-white rounded-[24px] p-8 shadow-apple border border-gray-100 mb-8 flex flex-col md:flex-row items-center gap-8">
                        <div class="w-full md:w-1/3 text-center border-r border-gray-100">
                            <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-appleBlue text-4xl">
                                <i class="fa-solid fa-heart-pulse"></i>
                            </div>
                            <h3 class="font-bold text-xl mb-1">健康目标：${state.userProfile.goal}</h3>
                            <p class="text-sm text-gray-500">避开过敏源：${state.userProfile.avoid}</p>
                            <button class="mt-4 text-appleBlue text-sm font-medium hover:underline">编辑档案</button>
                        </div>
                        <div class="w-full md:w-2/3">
                            <h3 class="font-bold text-lg mb-4">小智今日推荐食谱 (基于您的历史口味)</h3>
                            <div class="bg-gray-50 rounded-xl p-4 flex items-center justify-between mb-3 border border-gray-100">
                                <div class="flex items-center space-x-4">
                                    <img src="${DB.menu[2].img}" class="w-12 h-12 rounded-lg object-cover">
                                    <div>
                                        <p class="font-bold text-sm">午餐：${DB.menu[2].name} + 糙米饭</p>
                                        <p class="text-xs text-green-600">完美契合低GI减脂需求</p>
                                    </div>
                                </div>
                                <button onclick="addToCart(103)" class="text-appleBlue bg-blue-50 px-3 py-1 rounded-full text-sm hover:bg-blue-100 transition">采用</button>
                            </div>
                            <div class="bg-gray-50 rounded-xl p-4 flex items-center justify-between border border-gray-100">
                                <div class="flex items-center space-x-4">
                                    <img src="${DB.menu[3].img}" class="w-12 h-12 rounded-lg object-cover">
                                    <div>
                                        <p class="font-bold text-sm">加餐：${DB.menu[3].name}</p>
                                        <p class="text-xs text-orange-500">补充维C，提升免疫力</p>
                                    </div>
                                </div>
                                <button onclick="addToCart(104)" class="text-appleBlue bg-blue-50 px-3 py-1 rounded-full text-sm hover:bg-blue-100 transition">采用</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-appleDark text-white rounded-[24px] p-8 relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-64 h-64 bg-appleBlue rounded-full filter blur-[80px] opacity-20 -translate-y-1/2 translate-x-1/3"></div>
                        <h3 class="text-2xl font-bold mb-4 relative z-10">本周营养摄入分析</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 relative z-10">
                            <div class="bg-white/10 p-4 rounded-xl backdrop-blur-sm">
                                <p class="text-white/60 text-xs mb-1">蛋白质达成率</p>
                                <p class="text-2xl font-bold text-green-400">92%</p>
                            </div>
                            <div class="bg-white/10 p-4 rounded-xl backdrop-blur-sm">
                                <p class="text-white/60 text-xs mb-1">脂肪控制</p>
                                <p class="text-2xl font-bold text-blue-400">优秀</p>
                            </div>
                            <div class="bg-white/10 p-4 rounded-xl backdrop-blur-sm">
                                <p class="text-white/60 text-xs mb-1">碳水化合物</p>
                                <p class="text-2xl font-bold text-yellow-400">偏高</p>
                            </div>
                            <div class="bg-white/10 p-4 rounded-xl backdrop-blur-sm">
                                <p class="text-white/60 text-xs mb-1">卡路里结余</p>
                                <p class="text-2xl font-bold">-350 kcal</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            appRoot.innerHTML = html;
        }

        // ================= 模块3：社交广场 =================
        function renderSocialView() {
            let html = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8 slide-up">
                    <div class="md:col-span-2 space-y-6">
                        <h1 class="text-3xl font-bold mb-6">食话广场</h1>
                        <div class="bg-white p-6 rounded-[20px] shadow-sm border border-gray-100">
                            <textarea class="w-full bg-gray-50 rounded-xl p-4 border-none focus:ring-2 focus:ring-appleBlue/20 outline-none resize-none" rows="3" placeholder="今天在食堂吃得怎么样？分享一下吧..."></textarea>
                            <div class="flex justify-between items-center mt-4">
                                <div class="text-gray-400 space-x-3">
                                    <button class="hover:text-appleBlue transition"><i class="fa-regular fa-image text-lg"></i></button>
                                    <button class="hover:text-appleBlue transition"><i class="fa-regular fa-face-smile text-lg"></i></button>
                                    <button class="hover:text-appleBlue transition"><i class="fa-solid fa-location-dot text-lg"></i></button>
                                </div>
                                <button class="bg-appleDark text-white px-6 py-2 rounded-full font-medium hover:bg-black transition">发布</button>
                            </div>
                        </div>

                        ${DB.social.map(post => `
                            <div class="bg-white p-6 rounded-[20px] shadow-sm border border-gray-100">
                                <div class="flex items-center space-x-3 mb-4">
                                    <img src="${post.avatar}" class="w-10 h-10 rounded-full">
                                    <div>
                                        <p class="font-bold text-sm">${post.user}</p>
                                        <p class="text-xs text-gray-500">${post.time}</p>
                                    </div>
                                </div>
                                <p class="text-appleText mb-4 leading-relaxed">${post.content}</p>
                                <div class="flex items-center space-x-6 text-gray-400 text-sm">
                                    <button class="hover:text-appleBlue transition"><i class="fa-regular fa-thumbs-up mr-1"></i> ${post.likes}</button>
                                    <button class="hover:text-appleBlue transition"><i class="fa-regular fa-comment mr-1"></i> 回复</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="space-y-6">
                        <div class="bg-gradient-to-br from-blue-50 to-white p-6 rounded-[20px] border border-blue-100">
                            <h3 class="font-bold text-lg mb-4 flex items-center"><i class="fa-solid fa-fire text-red-500 mr-2"></i>本周红黑榜</h3>
                            <div class="space-y-4">
                                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                                    <span class="text-sm font-medium">1. 西红柿炒鸡蛋</span>
                                    <span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-md">好评率 98%</span>
                                </div>
                                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                                    <span class="text-sm font-medium">2. 糖醋排骨</span>
                                    <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md">避雷预警</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            appRoot.innerHTML = html;
        }

        // ================= 模块4：文创活动 =================
        function renderCultureView() {
            let html = `
                <div class="slide-up">
                    <div class="h-[300px] rounded-[24px] bg-cover bg-center mb-10 relative overflow-hidden flex items-center justify-center" style="background-image: url('https://images.unsplash.com/photo-1523580494112-071d4571af96?w=1200&q=80');">
                        <div class="absolute inset-0 bg-black/40"></div>
                        <div class="relative z-10 text-center text-white">
                            <h1 class="text-4xl md:text-5xl font-bold mb-4">探索校园文化味道</h1>
                            <p class="text-lg opacity-90">参与共创，品味属于中财的独特印记</p>
                        </div>
                    </div>

                    <h2 class="text-2xl font-bold mb-6">特色文创与周边</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                        ${DB.culture.map(item => `
                            <div class="bg-white rounded-[24px] flex flex-col sm:flex-row overflow-hidden shadow-sm border border-gray-100 hover:shadow-apple transition">
                                <img src="${item.img}" class="w-full sm:w-48 h-48 object-cover">
                                <div class="p-6 flex flex-col justify-between">
                                    <div>
                                        <h3 class="font-bold text-lg mb-2">${item.name}</h3>
                                        <p class="text-sm text-gray-500 mb-4">${item.desc}</p>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-appleBlue font-bold text-lg">¥${item.price.toFixed(1)}</span>
                                        <button class="bg-appleDark text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-black transition">立即预约</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-blue-50 rounded-[24px] p-8 border border-blue-100">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">学生共创菜品投票</h2>
                            <span class="text-sm text-appleBlue font-medium"><i class="fa-solid fa-clock mr-1"></i>距结束 3天</span>
                        </div>
                        <div class="bg-white rounded-xl p-6 shadow-sm flex flex-col md:flex-row items-center justify-between">
                            <div class="mb-4 md:mb-0">
                                <h3 class="font-bold text-lg">作品：星空冰粉 (创意者：经管大二 王同学)</h3>
                                <p class="text-sm text-gray-500 mt-1">采用蝶豆花天然变色，低糖健康，适合夏日解暑。</p>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="text-center">
                                    <div class="text-xl font-bold text-appleBlue">1,204</div>
                                    <div class="text-xs text-gray-400">当前票数</div>
                                </div>
                                <button onclick="alert('投票成功！小智已记录您的支持。')" class="bg-appleBlue text-white px-6 py-2 rounded-full font-medium hover:bg-blue-600 shadow-md transition-transform active:scale-95">为TA投票</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            appRoot.innerHTML = html;
        }

        // ================= 购物车与逻辑 =================
        function addToCart(id) {
            const item = DB.menu.find(m => m.id === id);
            const existing = state.cart.find(c => c.id === id);
            if (existing) {
                existing.qty++;
            } else {
                state.cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
            
            // 加入购物车特效提醒
            const btn = event.currentTarget;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i>';
            btn.classList.add('bg-green-500');
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-green-500');
            }, 1000);
        }

        function removeFromCart(id) {
            state.cart = state.cart.filter(c => c.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const drawer = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            
            let total = 0;
            let qtyTotal = 0;
            drawer.innerHTML = '';
            
            if (state.cart.length === 0) {
                drawer.innerHTML = '<div class="text-center text-gray-400 mt-10"><i class="fa-solid fa-basket-shopping text-4xl mb-4"></i><p>餐盘空空如也，快去选购吧~</p></div>';
            } else {
                state.cart.forEach(item => {
                    total += item.price * item.qty;
                    qtyTotal += item.qty;
                    drawer.innerHTML += `
                        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                            <div class="flex items-center space-x-3">
                                <img src="${item.img}" class="w-12 h-12 rounded-lg object-cover">
                                <div>
                                    <p class="font-semibold text-sm">${item.name}</p>
                                    <p class="text-appleBlue text-sm font-bold">¥${item.price.toFixed(1)}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-sm font-medium">x${item.qty}</span>
                                <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-600"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                    `;
                });
            }
            
            totalEl.innerText = `¥${total.toFixed(2)}`;
            if (qtyTotal > 0) {
                badge.innerText = qtyTotal;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('translate-x-full');
        }

        function simulateCheckout() {
            if (state.cart.length === 0) {
                alert("请先添加菜品到餐盘！");
                return;
            }
            
            toggleCart(); // 收起购物车
            
            // 模拟支付与小智联动
            const msg = `Apple Pay 支付成功！总计 ¥${document.getElementById('cart-total').innerText.replace('¥','')}。正在为您派单至【一食堂】...`;
            
            // 强行唤醒小智
            if(!state.aiOpen) toggleAI();
            
            setTimeout(() => {
                sendAiMessage("我已下单，请跟踪状态", true); // 静默发送请求
                setTimeout(() => {
                    renderAiMsg(`✅ ${msg}<br>预计需要等待 8 分钟。<br><br><b>您的取餐码是：A042</b><br>当餐品制作完成时，我会语音提醒您前往3号窗口取餐！`);
                    state.cart = []; // 清空购物车
                    updateCartUI();
                    
                    // 模拟5秒后餐好
                    setTimeout(() => {
                        const readyMsg = "滴！您的A042号餐品已制作完成，请前往一食堂3号窗口取餐。";
                        renderAiMsg(`🔔 <b>餐品完成提醒</b><br>${readyMsg}`);
                        speak(readyMsg); // 语音播报
                    }, 5000);
                }, 800);
            }, 500);
        }

        // ================= 小智 AI 系统逻辑 =================
        function toggleAI() {
            const panel = document.getElementById('ai-panel');
            state.aiOpen = !state.aiOpen;
            if (state.aiOpen) {
                panel.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                panel.classList.add('opacity-100', 'scale-100');
            } else {
                panel.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                panel.classList.remove('opacity-100', 'scale-100');
            }
        }

        function handleAiInput() {
            const input = document.getElementById('ai-input');
            const text = input.value.trim();
            if (!text) return;
            
            sendAiMessage(text);
            input.value = '';
        }

        document.getElementById('ai-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleAiInput();
        });

        function sendAiMessage(text, silent = false) {
            const messagesDiv = document.getElementById('ai-messages');
            
            if (!silent) {
                // 渲染用户消息
                messagesDiv.innerHTML += `
                    <div class="flex items-start justify-end space-x-2 mt-4 slide-up">
                        <div class="bg-appleBlue text-white p-3 rounded-2xl rounded-tr-none shadow-sm text-sm">
                            ${text}
                        </div>
                    </div>
                `;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            // 简单的意图识别 (Mock)
            setTimeout(() => {
                let reply = "我还在学习中，您可以试试问我排队情况或者推荐减脂餐哦！";
                
                if (text.includes("排队")) {
                    reply = `当前【中央财经大学·沙河校区第一食堂】排队人数较多（预计26分钟），建议前往【风味餐厅】（预计5分钟），座位充足。需要我帮您直接在风味餐厅点餐吗？`;
                } else if (text.includes("减脂")) {
                    reply = `为您量身定制：<br>主菜：清炒西兰花 (低卡高纤)<br>搭配：鸡胸肉沙拉<br>饮品：无糖黑乌龙茶<br>总计卡路里：约 320 kcal。<br><button onclick="addToCart(103); toggleAI(); navigate('order');" class="mt-2 text-appleBlue font-bold bg-white px-3 py-1 rounded-full text-xs shadow-sm border border-gray-100">一键加入餐盘</button>`;
                } else if (text.includes("占座")) {
                    reply = `已为您在【一食堂】二楼靠窗区域锁定座位：A012。<br>为您保留15分钟，请尽快前往哦！`;
                }

                renderAiMsg(reply);
            }, 600);
        }

        function renderAiMsg(htmlContent) {
            const messagesDiv = document.getElementById('ai-messages');
            messagesDiv.innerHTML += `
                <div class="flex items-start space-x-2 mt-4 slide-up">
                    <div class="w-8 h-8 rounded-full bg-appleBlue text-white flex shrink-0 items-center justify-center shadow-md"><i class="fa-solid fa-robot text-xs"></i></div>
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 text-appleText text-sm">
                        ${htmlContent}
                    </div>
                </div>
            `;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 初始化
        window.onload = () => {
            navigate('order');
            updateCartUI();
        };

    </script>
</body>
</html>
