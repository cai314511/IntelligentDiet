<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="botGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0071E3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="100" cy="100" r="95" fill="url(#botGradient)"/>
  
  <!-- 头部 -->
  <ellipse cx="100" cy="70" rx="35" ry="40" fill="#E3F2FD"/>
  
  <!-- 眼睛（扁平现代风格） -->
  <rect x="80" y="55" width="12" height="18" rx="6" fill="#0066CC"/>
  <rect x="108" y="55" width="12" height="18" rx="6" fill="#0066CC"/>
  
  <!-- 眼睛光点 -->
  <circle cx="86" cy="60" r="3" fill="#ffffff"/>
  <circle cx="114" cy="60" r="3" fill="#ffffff"/>
  
  <!-- 嘴巴（微笑） -->
  <path d="M 90 75 Q 100 82 110 75" stroke="#0066CC" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- 身体 -->
  <rect x="70" y="105" width="60" height="50" rx="8" fill="#ffffff"/>
  
  <!-- 身体装饰条纹 -->
  <rect x="75" y="110" width="50" height="3" rx="1.5" fill="#0066CC"/>
  <rect x="75" y="120" width="50" height="2" rx="1" fill="#E0E0E0"/>
  
  <!-- 左手臂 -->
  <rect x="45" y="115" width="25" height="12" rx="6" fill="#E3F2FD" transform="rotate(-20 57.5 121)"/>
  
  <!-- 右手臂 -->
  <rect x="130" y="115" width="25" height="12" rx="6" fill="#E3F2FD" transform="rotate(20 142.5 121)"/>
  
  <!-- 底部装饰 -->
  <ellipse cx="100" cy="160" rx="30" ry="8" fill="#E3F2FD"/>
  
  <!-- 发光效果 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#glowGradient)" stroke-width="2" opacity="0.6"/>
</svg>